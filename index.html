<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Habitaciones · Balcón al Mar</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>Habitaciones</h1>
        <p>Balcón al Mar</p>
      </div>

      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-secondary">
          Actualizar
        </button>

        <button id="printBtn" class="btn btn-secondary">
          Imprimir
        </button>
      </div>
    </div>
  </header>


  <main class="app-container">

    <!-- Modo de trabajo -->
    <section class="mode-selector">

      <button
        id="cleaningModeBtn"
        class="mode-btn active"
        type="button">
        Limpieza
      </button>

      <button
        id="receptionModeBtn"
        class="mode-btn"
        type="button">
        Recepción
      </button>

    </section>


    <!-- Usuario -->
    <section class="user-section">

      <label for="userName">
        Quién
      </label>

      <input
        id="userName"
        type="text"
        placeholder="Escribe tu nombre"
        autocomplete="name">

    </section>


    <!-- Estadísticas -->
    <section class="stats">

      <div class="stat-card">
        <span class="stat-number" id="dirtyCount">0</span>
        <span class="stat-label">Sucias</span>
      </div>

      <div class="stat-card">
        <span class="stat-number" id="readyCount">0</span>
        <span class="stat-label">Para revisar</span>
      </div>

      <div class="stat-card">
        <span class="stat-number" id="reviewedCount">0</span>
        <span class="stat-label">Revisadas</span>
      </div>

    </section>


    <!-- Habitaciones -->
    <section>

      <div class="section-heading">
        <h2>Habitaciones</h2>
        <span id="lastUpdate"></span>
      </div>

      <div id="roomsContainer" class="rooms-grid">
        <!-- Las habitaciones se generan desde JavaScript -->
      </div>

    </section>


    <!-- Actividad -->
    <section class="activity-section">

      <div class="section-heading">
        <h2>Actividad reciente</h2>
      </div>

      <div id="activityContainer" class="activity-list">
        <!-- Actividad generada desde JavaScript -->
      </div>

    </section>

  </main>


  <!-- Plantilla de habitación -->
  <template id="roomTemplate">

  <article class="room-card">

    <header class="room-card-header">

      <div>
        <span class="room-label">Habitación</span>
        <span class="room-number"></span>
      </div>

      <span class="status-badge room-status"></span>

    </header>


    <p class="hint room-hint"></p>


    <p class="who-line who-clean-line" hidden>
      Limpiada por:
      <strong class="who-name"></strong>
    </p>


    <p class="who-line who-review-line" hidden>
      Revisada por:
      <strong class="who-name"></strong>
    </p>


    <p class="card-error" hidden></p>


    <!-- Acción de limpieza -->
    <div class="action-clean">

      <button
        type="button"
        class="btn btn-accent btn-clean"
        data-action="clean">
        Marcar habitación limpia
      </button>

    </div>


    <!-- Checklist de recepción -->
    <div
      class="action-checklist checklist"
      hidden>

      <div class="checklist-header">
        <h4>Revisión de habitación</h4>
      </div>


      <div class="checklist-items">
        <!-- Los elementos se generan desde app.js -->
      </div>


      <label class="notes-label">

        Incidencias u observaciones (opcional)

        <textarea
          class="notes notes-input"
          rows="2"
          placeholder="Ej.: falta secador, mancha en la moqueta…"></textarea>

      </label>


      <button
        type="button"
        class="btn btn-accent btn-complete"
        data-action="confirm-review">
        Completar revisión
      </button>

    </div>


    <!-- Marcar habitación como sucia -->
    <div class="action-reset">

      <button
        type="button"
        class="btn btn-ghost btn-reset"
        data-action="reset">
        Registrar salida (marcar sucia)
      </button>

    </div>


    <!-- Historial -->
    <details class="history">

      <summary>
        Historial
        (<span class="history-count">0</span>)
      </summary>

      <ul class="history-list"></ul>

    </details>


    <!-- Compatibilidad con el código actual -->
    <span class="last-user" hidden></span>

    <button
      type="button"
      class="btn btn-cancel"
      data-action="cancel-review"
      hidden>
      Cancelar
    </button>

    <button
      type="button"
      class="btn btn-review"
      data-action="review"
      hidden>
      Revisar
    </button>

  </article>

</template>

  <!-- JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
